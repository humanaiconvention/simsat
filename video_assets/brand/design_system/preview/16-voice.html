<!doctype html><html><head><meta charset="utf-8"/>
<title>Voice</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; height:100%; }
  body { background:#0a0e27; padding: 18px 22px; display:flex; flex-direction:column; gap: 12px; justify-content:center; font-family: var(--font-sans); color: var(--fg-primary); font-size: 13px; line-height:1.45; }
  .row { display:grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: baseline; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-tertiary); }
  .yes { color: #dce6f5; }
  .no  { color: #6b7693; text-decoration: line-through; text-decoration-color: rgba(252,129,129,.5); }
</style>
</head><body>
  <div class="row"><div class="lbl">Yes</div><div class="yes">"Plus sixty-eight point eight points."</div></div>
  <div class="row"><div class="lbl">No</div><div class="no">"A massive, breakthrough +68.8 pp lift!"</div></div>
  <div class="row"><div class="lbl">Yes</div><div class="yes">"What it can ferry is JSON."</div></div>
  <div class="row"><div class="lbl">No</div><div class="no">"Unleashing the power of on-orbit AI."</div></div>
</body></html>

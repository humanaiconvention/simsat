<!doctype html><html><head><meta charset="utf-8"/>
<title>Type — mono / numerals</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; height:100%; }
  body { background:#050812; padding: 22px 28px; display:flex; flex-direction:column; gap: 14px; justify-content:center; font-family: var(--font-mono); }
  .lbl { font-size: 10px; letter-spacing: .12em; color: var(--fg-tertiary); text-transform: uppercase; }
  pre { margin:0; font-size: 13px; line-height: 1.55; color: var(--fg-primary); background: transparent; padding: 0; border: 0; }
  .num { font-size: 28px; color: #fef3c7; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .num small { font-size: 13px; color: var(--fg-secondary); margin-left: 8px; letter-spacing: 0; }
</style>
</head><body>
  <div><div class="lbl">Numeral — accent</div><div class="num">+68.8 pp <small>action lift</small></div></div>
  <div><div class="lbl">JSON receipt — JetBrains Mono 13</div><pre>{
  "exact_action_agreement": 0.844,
  "score_mae": 0.055,
  "parse_rate": 1.000
}</pre></div>
</body></html>

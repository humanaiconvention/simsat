<!doctype html><html><head><meta charset="utf-8"/>
<title>Viability gates</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; height:100%; }
  body { background:#0a0e27; padding: 16px 22px; display:flex; flex-direction:column; gap: 8px; justify-content:center; font-family: var(--font-mono); font-size: 12px; color: var(--fg-primary); }
  .row { display:flex; align-items:center; gap: 10px; }
  .ix { width: 14px; color:#6b7693; font-size:10px; }
  .name { flex:1; }
  .state { font-size:10px; letter-spacing:.12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(220,230,245,.16); }
  .pass { color:#68d391; border-color: rgba(104,211,145,.32); }
  .block { color:#fc8181; border-color: rgba(252,129,129,.36); }
  .warn { color:#a0aec0; }
</style>
</head><body>
  <div class="row"><span class="ix">1</span><span class="name">information_gain</span><span class="state pass">pass</span></div>
  <div class="row"><span class="ix">2</span><span class="name">observation_quality</span><span class="state pass">pass</span></div>
  <div class="row"><span class="ix">3</span><span class="name">metadata_consistency</span><span class="state pass">pass</span></div>
  <div class="row"><span class="ix">4</span><span class="name">update_magnitude</span><span class="state warn">log</span></div>
  <div class="row"><span class="ix">5</span><span class="name">update_rate</span><span class="state warn">log</span></div>
  <div class="row"><span class="ix">6</span><span class="name">error_balance</span><span class="state block">block</span></div>
</body></html>

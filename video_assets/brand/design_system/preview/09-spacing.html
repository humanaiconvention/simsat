<!doctype html><html><head><meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; height:100%; }
  body { background:#0a0e27; padding: 18px 24px; display:flex; flex-direction:column; gap: 10px; justify-content:center; font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); letter-spacing: .04em; }
  .row { display:flex; align-items:center; gap: 14px; }
  .bar { height: 10px; background: #fef3c7; border-radius: 2px; }
  .name { width: 36px; color: var(--fg-primary); }
  .px { width: 60px; color: var(--fg-tertiary); }
</style>
</head><body>
  <div class="row"><span class="name">s-1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
  <div class="row"><span class="name">s-2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
  <div class="row"><span class="name">s-3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
  <div class="row"><span class="name">s-4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
  <div class="row"><span class="name">s-5</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
  <div class="row"><span class="name">s-6</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
  <div class="row"><span class="name">s-7</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
  <div class="row"><span class="name">s-8</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
</body></html>

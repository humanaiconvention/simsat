[pytest]
testpaths = tests
addopts = -ra
# Default basetemp (system tmpdir) avoids Windows permission-cleanup races
# that occur when pytest's basetemp lives inside the repo working tree.
# See SimSat 2026-05-07 quickstart pass — the previous --basetemp=D:/SimSat/.test_tmp
# caused 42 PermissionError-on-cleanup pseudo-failures on Windows even though
# all 188 tests passed.

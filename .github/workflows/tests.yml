name: tests

on:
  push:
    branches: [main, master, codex/*]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Install requirements.txt minus the GPU/heavy items (torch,
        # torchvision, cartopy, odc-stac). Pulls in fastapi, pydantic,
        # numpy, pyorbital, Pillow, matplotlib, transformers, peft,
        # accelerate, anthropic — everything needed for the 33-test
        # unit suite without 3+ GB of CUDA wheels.
        # Then add CPU-only torch from the PyTorch CPU wheel index
        # (~200 MB) so transformers can import without crashing.
        # Note: PyPI package `pydispatcher` provides the `pydispatch`
        # module (different name) — required by simulator.py.
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|torchvision|cartopy|pyqt|bitsandbytes)' requirements.txt > requirements-ci.txt
          echo "pydispatcher>=2.0.7" >> requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<2.8"

      - name: Run unit tests
        run: |
          python -m pytest src/sim/tests/ -v --no-header

  scrub-check:
    name: hardcoded-paths scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail on hardcoded user paths
        run: |
          set -e
          # Allow KNOWN_ISSUES / collaborator notes to mention paths in prose,
          # but reject hardcoded D:/SimSat or C:/Users/benja in code.
          if grep -RInE '(D:[/\\]SimSat|C:[/\\]Users[/\\]benja)' \
                --include='*.py' --include='*.toml' --include='*.yaml' --include='*.yml' \
                src/ scripts/ tests/ ; then
            echo ""
            echo "ERROR: hardcoded developer-machine paths found above."
            echo "Use Path(__file__).resolve().parents[N] / 'subpath' instead."
            exit 1
          fi
          echo "OK — no hardcoded paths in source/scripts/tests."

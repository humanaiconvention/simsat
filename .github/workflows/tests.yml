name: tests

on:
  push:
    branches: [main, master, codex/*]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test dependencies
        # Skip the full requirements.txt — torch + cartopy + odc-stac add 3+ GB
        # and aren't needed for the 33 tests in src/sim/tests/. Install only
        # what the unit tests actually import.
        # Note: PyPI package `pydispatcher` provides the `pydispatch` module
        # (different name) — required by simulator.py and pulled in via
        # test_propagator.py's import chain.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.110,<0.120" \
            "uvicorn>=0.27,<0.35" \
            "pydantic>=2.6,<3" \
            "httpx>=0.27" \
            "requests>=2.31" \
            "numpy>=1.26,<3" \
            "pyorbital>=1.8" \
            "pydispatcher>=2.0.7" \
            "Pillow>=10.0" \
            "pytest>=8.0" \
            "pytest-mock>=3.12"

      - name: Run unit tests
        run: |
          python -m pytest src/sim/tests/ -v --no-header

  scrub-check:
    name: hardcoded-paths scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail on hardcoded user paths
        run: |
          set -e
          # Allow KNOWN_ISSUES / collaborator notes to mention paths in prose,
          # but reject hardcoded D:/SimSat or C:/Users/benja in code.
          if grep -RInE '(D:[/\\]SimSat|C:[/\\]Users[/\\]benja)' \
                --include='*.py' --include='*.toml' --include='*.yaml' --include='*.yml' \
                src/ scripts/ tests/ ; then
            echo ""
            echo "ERROR: hardcoded developer-machine paths found above."
            echo "Use Path(__file__).resolve().parents[N] / 'subpath' instead."
            exit 1
          fi
          echo "OK — no hardcoded paths in source/scripts/tests."
